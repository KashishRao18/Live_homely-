<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Room</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* ✅ Form container styling */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            background: #f9f9f9;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px #4CAF50;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .checkbox-container input {
            width: auto;
            margin-right: 10px;
        }

        .btn {
            display: inline-block;
            width: 48%;
            padding: 12px 20px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            background: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #45a049;
        }
        
        .btn-secondary {
            background: #555;
        }

        .btn-secondary:hover {
            background: #333;
        }

        .image-preview {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .image-preview img {
            width: 150px;
            height: auto;
            border: 2px solid #ccc;
            border-radius: 8px;
            transition: 0.3s;
        }

        .image-preview img:hover {
            border-color: #4CAF50;
            transform: scale(1.05);
        }

        .form-buttons {
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            .btn {
                width: 100%;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Edit Room</h1>

    <form action="{{ url_for('edit_room', room_id=room.room_id) }}" method="POST" enctype="multipart/form-data">

        <label for="room_type">Room Type:</label>
        <input type="text" id="room_type" name="room_type" value="{{ room.room_type }}" required>

        <label for="price">Price:</label>
        <input type="number" id="price" name="price" value="{{ room.price }}" step="0.01" required>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required>{{ room.description }}</textarea>

        <div class="checkbox-container">
            <input type="checkbox" id="availability" name="availability" {% if room.availability %}checked{% endif %}>
            <label for="availability">Availability</label>
        </div>

        <label for="amenity">Amenities:</label>
        <input type="text" id="amenity" name="amenity" value="{{ room.amenity }}" required>

        <label for="room_image">Room Image:</label>
        <input type="file" id="room_image" name="room_image">

        {% if room.room_image %}
        <div class="image-preview">
            <p>Current Image:</p>
            <img src="{{ url_for('static', filename='images/' + room.room_image) }}" alt="Room Image">
        </div>
        {% endif %}

        <div class="form-buttons">
            <button type="submit" class="btn">Update Room</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>

    </form>
</div>

</body>
</html>
