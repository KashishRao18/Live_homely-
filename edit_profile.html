{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Edit Profile</h2>
    <form method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ user.email }}" readonly>
    
        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" name="first_name" value="{{ user.first_name or '' }}" required>
        <div id="first_name_error" class="error-message"></div>
    
        <label for="last_name">Last Name:</label>
        <input type="text" id="last_name" name="last_name" value="{{ user.last_name or '' }}" required>
        <div id="last_name_error" class="error-message"></div>
    
        <label for="contact">Contact:</label>
        <input type="tel" id="contact" name="contact" value="{{ user.contact or '' }}" pattern="[0-9]{10}" required>
        <small>Contact should be a 10-digit number.</small>
        <div id="contact_error" class="error-message"></div>
    
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" value="{{ user.dob or '' }}" required>
        <div id="dob_error" class="error-message"></div>
    
        <label for="address">Address:</label>
        <textarea id="address" name="address" required>{{ user.address or '' }}</textarea>
    
        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="Male" {% if user.gender == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if user.gender == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if user.gender == 'Other' %}selected{% endif %}>Other</option>
        </select>
    
        <label for="profile_image">Profile Image:</label>
        <input type="file" id="profile_image" name="profile_image">
    
        {% if user.profile_image %}
            <img src="{{ url_for('static', filename='images/' + user.profile_image) }}" alt="Profile Image" class="img-thumbnail" width="150" height="150">
        {% else %}
            <img src="{{ url_for('static', filename='images/default.png') }}" alt="Default Image" class="img-thumbnail" width="150" height="150">
        {% endif %}
    
        <button type="submit">Update Profile</button>
    </form>
    
</div>

<style>
    .error-message {
        color: red;
        font-size: 0.9em;
    }
</style>

<script>
    function clearErrors() {
        var errors = document.getElementsByClassName('error-message');
        for (var i = 0; i < errors.length; i++) {
            errors[i].innerText = '';
        }
    }

    function validateForm() {
        clearErrors(); // Clear previous errors

        var isValid = true;

        // First Name
        var firstName = document.getElementById('first_name').value;
        var firstNameError = document.getElementById('first_name_error');
        var namePattern = /^[A-Za-z]+$/;
        if (!firstName.trim() || !namePattern.test(firstName) || firstName.length > 50) {
            firstNameError.innerText = 'First name must only contain alphabetic characters.';
            isValid = false;
        }

        // Last Name
        var lastName = document.getElementById('last_name').value;
        var lastNameError = document.getElementById('last_name_error');
        if (!lastName.trim() || !namePattern.test(lastName) || lastName.length > 50) {
            lastNameError.innerText = 'Last name must only contain alphabetic characters and be under 50 characters.';
            isValid = false;
        }

        // Contact Number
        var contact = document.getElementById('contact').value;
        var contactError = document.getElementById('contact_error');
        var contactPattern = /^[0-9]{10}$/;
        if (!contactPattern.test(contact)) {
            contactError.innerText = 'Please enter a valid 10-digit contact number.';
            isValid = false;
        }

        // Date of Birth
        var dob = document.getElementById('dob').value;
        var dobError = document.getElementById('dob_error');
        var dobDate = new Date(dob);
        var today = new Date();
        var age = today.getFullYear() - dobDate.getFullYear();
        var m = today.getMonth() - dobDate.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < dobDate.getDate())) {
            age--;
        }

        if (dobDate > today) {
            dobError.innerText = 'Date of Birth cannot be in the future.';
            isValid = false;
        } else if (age < 18) {
            dobError.innerText = 'You must be at least 18 years old.';
            isValid = false;
        }

        return isValid;
    }
</script>

{% endblock %}
