<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice - Hotel Reservation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .summary {
            margin-bottom: 20px;
        }
        .summary p {
            margin: 8px 0;
        }
        .btn {
            display: inline-block;
            padding: 10px 25px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background: #45a049;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Invoice</h2>

    <div class="summary">
        <p><strong>Booking ID:</strong> {{ booking.booking_id }}</p>
        <p><strong>Guest:</strong> {{ user.username }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>Check-in:</strong> {{ booking.check_in }}</p>
        <p><strong>Check-out:</strong> {{ booking.check_out }}</p>
        <p><strong>Guests:</strong> {{ booking.guests }}</p>
        <p><strong>Total Amount:</strong> ₹{{ booking.total_amount }}</p>
    </div>

    <div class="footer">
        <a href="{{ url_for('generate_invoice', booking_id=booking.booking_id) }}" class="btn">Download PDF</a>
    </div>
</div>

</body>
</html>
