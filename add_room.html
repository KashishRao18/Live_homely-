{% extends 'base.html' %}
{% block content %}

<div class="container">
    <h2>Add New Room</h2>

    <!-- <form action="{{ url_for('add_room') }}" method="POST" enctype="multipart/form-data" id="room-form"> -->

    <form action="{{ url_for('add_room') }}" method="POST" enctype="multipart/form-data"
        onsubmit="return validateRoomForm()">
        <label for="room_type">Room Type:</label>
        <input type="text" id="room_type" name="room_type" required>
        <div id="room_type_error" class="error-message"></div>

        <label for="price">Price:</label>
        <input type="number" id="price" name="price" step="0.01" required>
        <div id="price_error" class="error-message"></div>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea>
        <div id="description_error" class="error-message"></div>

        <label for="availability">Availability:</label>
        <input type="checkbox" id="availability" name="availability">

        <label for="amenity">Amenities:</label>
        <input type="text" id="amenity" name="amenity" required>
        <div id="amenity_error" class="error-message"></div>

        <label for="room_image">Room Image:</label>
        <input type="file" id="room_image" name="room_image" accept="image/*">
        <div id="room_image_error" class="error-message"></div>

        <button type="submit" class="btn btn-success">Add Room</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>

</div>


<style>
    .error-message {
        color: red;
        font-size: 0.9em;
        margin-bottom: 10px;
    }
</style>

<script>
    function clearRoomErrors() {
        const errorFields = document.getElementsByClassName('error-message');
        for (let err of errorFields) {
            err.innerText = '';
        }
    }

    function validateRoomForm() {
        clearRoomErrors();
        let isValid = true;

        const namePattern = /^[A-Za-z\s]{1,50}$/;

        // Room Type
        const roomType = document.getElementById('room_type').value.trim();
        if (!namePattern.test(roomType)) {
            document.getElementById('room_type_error').innerText = "Room type must be alphabetic (max 50 characters).";
            isValid = false;
        }

        // Price
        const price = document.getElementById('price').value;
        if (price <= 0) {
            document.getElementById('price_error').innerText = "Price must be a positive number.";
            isValid = false;
        }

        // Description
        const description = document.getElementById('description').value.trim();
        const hasLetters = /[A-Za-z]/.test(description);

        if (description.length < 10 || !hasLetters) {
            document.getElementById('description_error').innerText = "Description must be at least 10 characters and contain letters.";
            isValid = false;
        }

        // Amenity
        const amenity = document.getElementById('amenity').value.trim();
        const amenityList = amenity.split(',');

        if (amenityList.length === 0 || !amenity) {
            document.getElementById('amenity_error').innerText = "Please enter at least one amenity.";
            isValid = false;
        } else {
            const amenityPattern = /^[A-Za-z0-9\s"’'&().-]{2,100}$/;
            for (let i = 0; i < amenityList.length; i++) {
                const item = amenityList[i].trim();
                if (!amenityPattern.test(item)) {
                    document.getElementById('amenity_error').innerText = `Amenity "${item}" contains invalid characters or is too short.`;
                    isValid = false;
                    break;
                }
            }
        }

        // Room Image
        const imageInput = document.getElementById('room_image');
        const file = imageInput.files[0];
        if (file) {
            const validTypes = ['image/jpeg', 'image/png', 'image/jpg', 'image/webp'];
            if (!validTypes.includes(file.type)) {
                document.getElementById('room_image_error').innerText = "Only JPG, PNG, or WebP image files are allowed.";
                isValid = false;
            }
        }

        return isValid;
    }
</script>
{% endblock %}
