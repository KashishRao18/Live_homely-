{% extends "base.html" %}

{% block content %}
<h1>Customer Management</h1>

<table>
    <thead>
        <tr>
            <th>Customer ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Contact</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for customer in customers %}
        <tr>
            <td>{{ customer.id }}</td>
            <td>{{ customer.username }}</td>
            <td>{{ customer.email }}</td>
            <td>{{ customer.contact }}</td>
            <td>
                <a href="{{ url_for('delete_user', user_id=customer.id) }}" class="btn btn-danger">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
